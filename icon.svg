<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bbBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1a33"/>
      <stop offset="65%" stop-color="#081220"/>
      <stop offset="100%" stop-color="#060d13"/>
    </radialGradient>
    <linearGradient id="bbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bbShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1e3b"/>
      <stop offset="100%" stop-color="#060d17"/>
    </linearGradient>
    <linearGradient id="bbPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed dark background extending edge-to-edge with zero white or transparent margins -->
  <rect width="512" height="512" fill="#060d13"/>
