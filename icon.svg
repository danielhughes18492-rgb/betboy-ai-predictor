  <path d="M128,214 L200,166 L261,198 L368,120" fill="none" stroke="#29b6f6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="368" cy="120" r="17" fill="#2dd4bf"/>
  <text x="256" y="278" font-family="system-ui,-apple-system,Arial,sans-serif" font-weight="900" font-size="84" fill="#ffffff" text-anchor="middle" letter-spacing="1">BET<tspan fill="#2dd4bf">BOY</tspan></text>
  <rect x="128" y="308" width="256" height="62" rx="31" fill="url(#bbPill)"/>
  <text x="256" y="348" font-family="system-ui,-apple-system,Arial,sans-serif" font-weight="900" font-size="26" fill="#020617" text-anchor="middle" letter-spacing="2.5">AI PREDICTOR</text>
