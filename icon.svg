  <circle cx="256" cy="256" r="246" fill="url(#bbBg)" stroke="url(#bbRing)" stroke-width="16"/>
  <path d="M256,56 L418,120 V260 C418,360 342,430 256,460 C170,430 94,360 94,260 V120 Z" fill="url(#bbShield)" stroke="url(#bbRing)" stroke-width="10" stroke-linejoin="round"/>
